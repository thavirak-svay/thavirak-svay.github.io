<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes bgCycle {
      0%, 100% { fill: transparent; }
      50% { fill: black; }
    }
    @keyframes strokeCycle {
      0%, 100% { stroke: black; }
      50% { stroke: white; }
    }
    .bg-animate {
      animation: bgCycle 2s ease-in-out infinite;
    }
    .stroke-animate {
      animation: strokeCycle 2s ease-in-out infinite;
    }
  </style>
  <rect width="100" height="100" rx="16" class="bg-animate"/>
  <g fill="none" stroke="black" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="stroke-animate">
    <path d="M -5 25 Q 25 25 25 -5" />
    <path d="M 55 -5 L 55 25 Q 55 45 80 45 L 105 45" />
    <path d="M 80 45 L 80 20 L 80 -5" />
    <path d="M -5 60 L 30 60 Q 55 60 55 85 L 55 105" />
    <path d="M 25 105 L 25 90 Q 25 80 5 80 L -5 80" />
    <path d="M 105 75 Q 80 75 80 95 L 80 105" />
    <path d="M 105 105 L 100 100" stroke-width="0" />
    <path d="M 105 95 Q 105 105 95 105" stroke-width="6" />
  </g>
</svg>